name: Build FeedLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Set up Gradle 8.9 with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Extract source
        run: |
          mkdir -p source
          unzip -q ci/FeedLauncher-v0.31.03b-GitHub-Source.zip -d source

      - name: Apply Launcher3 foundation patch
        run: |
          cd source
          patch --batch --forward -p1 < ../ci/patches/launcher3-foundation.patch
          grep -n "versionCode\|versionName" app/build.gradle
          test -f app/src/main/java/br/com/danilo/feedlauncher/classic/L3GridOccupancy.java

      - name: Apply Launcher3 workspace reorder patch
        run: |
          base64 --decode ci/patches/launcher3-workspace-reorder.patch.gz.b64 > /tmp/launcher3-workspace-reorder.patch.gz
          gzip -dc /tmp/launcher3-workspace-reorder.patch.gz > /tmp/launcher3-workspace-reorder.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-workspace-reorder.patch
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n "REORDER_TIMEOUT" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicWorkspace.java
          grep -n "tmpCellX" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicCellLayout.java

      - name: Apply Launcher3 widget temporary state patch
        run: |
          base64 --decode ci/patches/launcher3-widget-tmp-state.patch.gz.b64 > /tmp/launcher3-widget-tmp-state.patch.gz
          gzip -dc /tmp/launcher3-widget-tmp-state.patch.gz > /tmp/launcher3-widget-tmp-state.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-widget-tmp-state.patch
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n "setItemTmpGeometry" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicCellLayout.java
          grep -n "tmpCellX" app/src/main/java/br/com/danilo/feedlauncher/classic/L3WidgetResizeFrame.java

      - name: Apply Launcher3 drag modes patch
        run: |
          base64 --decode ci/patches/launcher3-drag-modes.patch.gz.b64 > /tmp/launcher3-drag-modes.patch.gz
          gzip -dc /tmp/launcher3-drag-modes.patch.gz > /tmp/launcher3-drag-modes.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-drag-modes.patch
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n "DRAG_MODE_CREATE_FOLDER" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicWorkspace.java
          grep -n "folderCreationRadius" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicCellLayout.java

      - name: Apply Launcher3 temporary commit patch
        run: |
          base64 --decode ci/patches/launcher3-temp-commit.patch.gz.b64 > /tmp/launcher3-temp-commit.patch.gz
          gzip -dc /tmp/launcher3-temp-commit.patch.gz > /tmp/launcher3-temp-commit.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-temp-commit.patch
          grep -n "versionCode\\|versionName" app/build.gradle
          grep -n "commitTempPlacement" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicCellLayout.java
          grep -n "commitSamePagePlan" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicWorkspace.java

      - name: Apply Launcher3 reorder preview patch
        run: |
          base64 --decode ci/patches/launcher3-reorder-preview.patch.gz.b64 > /tmp/launcher3-reorder-preview.patch.gz
          gzip -dc /tmp/launcher3-reorder-preview.patch.gz > /tmp/launcher3-reorder-preview.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-reorder-preview.patch
          grep -n "versionCode\\|versionName" app/build.gradle
          test -f app/src/main/java/br/com/danilo/feedlauncher/classic/L3ReorderPreviewAnimation.java
          grep -n "showReorderHint" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicCellLayout.java

      - name: Apply Launcher3 DragView drop patch
        run: |
          base64 --decode ci/patches/launcher3-dragview-drop.patch.gz.b64 > /tmp/launcher3-dragview-drop.patch.gz
          gzip -dc /tmp/launcher3-dragview-drop.patch.gz > /tmp/launcher3-dragview-drop.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-dragview-drop.patch
          grep -n "versionCode\\|versionName" app/build.gradle
          test -f app/src/main/java/br/com/danilo/feedlauncher/classic/L3DragView.java
          grep -n "captureDestination" app/src/main/java/br/com/danilo/feedlauncher/classic/L3ItemDragController.java

      - name: Apply Launcher3 spring pages patch
        run: |
          base64 --decode ci/patches/launcher3-spring-pages.patch.gz.b64 > /tmp/launcher3-spring-pages.patch.gz
          gzip -dc /tmp/launcher3-spring-pages.patch.gz > /tmp/launcher3-spring-pages.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-spring-pages.patch
          grep -n "versionCode\\|versionName" app/build.gradle
          grep -n "beginDragPageSession" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicWorkspace.java
          grep -n "EDGE_SCROLL_HINT_DURATION" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicWorkspace.java

      - name: Apply Launcher3 widget DragView patch
        run: |
          base64 --decode ci/patches/launcher3-widget-dragview.patch.gz.b64 > /tmp/launcher3-widget-dragview.patch.gz
          gzip -dc /tmp/launcher3-widget-dragview.patch.gz > /tmp/launcher3-widget-dragview.patch
          cd source
          patch --batch --forward -p1 < /tmp/launcher3-widget-dragview.patch
          grep -n "versionCode\\|versionName" app/build.gradle
          grep -n "L3DragView dragView" app/src/main/java/br/com/danilo/feedlauncher/classic/L3WidgetDragController.java
          grep -n "completePendingWidgetDrop" app/src/main/java/br/com/danilo/feedlauncher/classic/ClassicWorkspace.java

      - name: Create temporary CI signing key
        working-directory: source
        run: |
          keytool -genkeypair -v \
            -keystore development.keystore \
            -storepass android \
            -keypass android \
            -alias feed \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FeedLauncher CI,O=FeedLauncher,C=BR"

      - name: Build release APK
        working-directory: source
        run: gradle assembleRelease --build-cache --parallel --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp source/app/build/outputs/apk/release/*.apk out/FeedLauncher-v0.31.12-Launcher3-Widget-DragView-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeedLauncher-v0.31.12-Launcher3-Widget-DragView-APK
          path: out/FeedLauncher-v0.31.12-Launcher3-Widget-DragView-release.apk
          if-no-files-found: error
          retention-days: 14
